name: Build

# A tag push builds, tests and publishes a release. A dispatch builds and tests
# the branch it names, which is how the forge's upstream job checks a candidate.
on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: tresbientech/drupack/.github/workflows/build.yml@1.0.0-beta10
    with:
      publish: true
